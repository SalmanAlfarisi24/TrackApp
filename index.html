<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrackApp</title>
    
    <!-- PWA Meta -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4f46e5">
    
    <!-- Icons -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text x='50' y='65' font-family='sans-serif' font-size='50' font-weight='bold' fill='white' text-anchor='middle'>TA</text></svg>" type="image/svg+xml">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/4f46e5/ffffff?text=TA">
    <link rel="manifest" id="dynamic-manifest">
    
    <!-- Styling & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .accordion-content { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .accordion-inner { overflow: hidden; opacity: 0; transform: translateY(-5px); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .accordion-open { grid-template-rows: 1fr; }
        .accordion-open .accordion-inner { opacity: 1; transform: translateY(0); }
        
        .item-enter { animation: slideUp 0.3s ease-out forwards; opacity: 0; }
        .item-leave { opacity: 0; transform: translateX(-100%) scale(0.95); transition: all 0.3s ease-in-out; }
        .tab-enter { animation: fadeIn 0.3s ease-out forwards; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="text-gray-800 antialiased overflow-hidden">

    <!-- Container -->
    <div class="max-w-md mx-auto bg-white h-[100dvh] flex flex-col relative shadow-2xl overflow-hidden">
        
        <!-- Install PWA -->
        <div id="install-banner" class="hidden absolute top-4 left-4 right-4 bg-white border border-gray-100 rounded-2xl shadow-2xl z-[60] p-4 flex items-center justify-between animate-[slideDown_0.3s_ease-out]">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center flex-shrink-0">
                    <span class="text-white font-bold">TA</span>
                </div>
                <div class="flex flex-col">
                    <span class="font-bold text-sm text-gray-800">Install TrackApp</span>
                    <span class="text-xs text-gray-500">Tambahkan ke layar utama</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="install-btn" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold shadow hover:bg-indigo-700 active:scale-95 transition-all">Install</button>
                <button onclick="closeInstallBanner()" class="text-gray-400 hover:text-gray-600 p-1.5 rounded-full hover:bg-gray-100 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </div>

        <!-- Header -->
        <header class="bg-indigo-600 text-white pt-6 pb-4 px-6 rounded-b-2xl shadow-md z-10 flex-shrink-0">
            <h1 class="text-2xl font-bold tracking-tight">TrackApp</h1>
            <p class="text-indigo-200 text-sm mt-1">Kelola Tugas & Lomba Anda</p>
        </header>

        <!-- Tabs -->
        <div class="flex px-4 pt-4 pb-2 space-x-2 flex-shrink-0">
            <button id="tab-tugas" onclick="switchTab('tugas')" class="flex-1 py-2 px-4 rounded-full font-semibold text-sm transition-colors bg-indigo-100 text-indigo-700 shadow-sm border border-indigo-200">
                Tugas Kuliah
            </button>
            <button id="tab-lomba" onclick="switchTab('lomba')" class="flex-1 py-2 px-4 rounded-full font-semibold text-sm transition-colors text-gray-500 hover:bg-gray-100 border border-transparent">
                Lomba
            </button>
        </div>

        <!-- Content -->
        <main class="flex-1 overflow-y-auto no-scrollbar p-4 relative pb-24">
            <div id="view-tugas" class="space-y-4"></div>
            <div id="view-lomba" class="hidden space-y-4"></div>

            <div id="empty-state" class="hidden flex flex-col items-center justify-center h-full text-gray-400 mt-20">
                <svg class="w-16 h-16 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                <p class="text-center font-medium">Belum ada data.<br>Tekan tombol + untuk menambah.</p>
            </div>
        </main>

        <!-- FAB Add -->
        <button onclick="openModal()" class="absolute bottom-6 right-6 w-14 h-14 bg-indigo-600 rounded-full shadow-lg hover:shadow-xl text-white flex items-center justify-center hover:bg-indigo-700 active:bg-indigo-800 active:scale-90 transition-all z-20">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </button>

        <!-- Modal Form -->
        <div id="modal-overlay" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center px-4">
            <div id="modal-content" class="bg-white rounded-2xl w-full max-w-sm shadow-2xl p-6 transition-all transform scale-95 opacity-0">
                <div class="flex justify-between items-center mb-5">
                    <h2 id="modal-title" class="text-xl font-bold text-gray-800">Tambah Data</h2>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 p-1">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                
                <form id="add-form" onsubmit="saveData(event)">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Judul</label>
                            <input type="text" id="input-judul" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="Masukkan judul...">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi</label>
                            <textarea id="input-deskripsi" rows="3" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all resize-none" placeholder="Tulis keterangan detail (bisa sertakan link URL)..."></textarea>
                        </div>
                        <div>
                            <label id="label-waktu" class="block text-sm font-medium text-gray-700 mb-1">Waktu</label>
                            <input type="datetime-local" id="input-waktu" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-gray-700 bg-white">
                        </div>
                    </div>
                    
                    <div class="mt-8 flex space-x-3">
                        <button type="button" onclick="closeModal()" class="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-medium hover:bg-gray-200 active:scale-95 transition-all">Batal</button>
                        <button type="submit" class="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl font-medium hover:bg-indigo-700 active:scale-95 transition-all shadow-md shadow-indigo-200">Simpan</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Modal Delete -->
        <div id="delete-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center px-4">
            <div id="delete-modal-content" class="bg-white rounded-2xl w-full max-w-sm shadow-2xl p-6 transition-all transform scale-95 opacity-0 text-center">
                <div class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                </div>
                <h2 class="text-xl font-bold text-gray-800 mb-2">Hapus Data?</h2>
                <p class="text-gray-500 text-sm mb-6">Tindakan ini tidak dapat dibatalkan.</p>
                <div class="flex space-x-3">
                    <button onclick="closeDeleteModal()" class="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-medium hover:bg-gray-200 active:scale-95 transition-all">Batal</button>
                    <button onclick="executeDelete()" class="flex-1 py-2.5 bg-red-600 text-white rounded-xl font-medium hover:bg-red-700 active:scale-95 transition-all shadow-md shadow-red-200">Hapus</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // App State
        let currentTab = 'tugas';
        let tasks = JSON.parse(localStorage.getItem('trackapp_tugas')) || [];
        let competitions = JSON.parse(localStorage.getItem('trackapp_lomba')) || [];
        let editingItemId = null;
        let itemToDeleteId = null;
        let expandedItemId = null; // State Accordion

        // DOM Nodes
        const tabTugasBtn = document.getElementById('tab-tugas');
        const tabLombaBtn = document.getElementById('tab-lomba');
        const viewTugas = document.getElementById('view-tugas');
        const viewLomba = document.getElementById('view-lomba');
        const emptyState = document.getElementById('empty-state');
        
        const modalOverlay = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const labelWaktu = document.getElementById('label-waktu');
        const inputWaktu = document.getElementById('input-waktu');
        const inputJudul = document.getElementById('input-judul');
        const inputDeskripsi = document.getElementById('input-deskripsi');

        const deleteModal = document.getElementById('delete-modal');
        const deleteModalContent = document.getElementById('delete-modal-content');

        // Utils
        function formatDate(dateString, isDatetime) {
            const options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
            if (isDatetime) {
                options.hour = '2-digit';
                options.minute = '2-digit';
            }
            return new Date(dateString).toLocaleDateString('id-ID', options);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, url => `<a href="${url}" target="_blank" rel="noopener noreferrer" class="text-indigo-500 font-medium hover:underline hover:text-indigo-700" onclick="event.stopPropagation()">${url}</a>`);
        }

        // Accordion Toggle
        window.toggleDescription = function(id) {
            if (expandedItemId === id) {
                document.getElementById(`content-${id}`)?.classList.remove('accordion-open');
                document.getElementById(`arrow-${id}`)?.classList.remove('rotate-90');
                expandedItemId = null;
                return;
            }

            if (expandedItemId) {
                document.getElementById(`content-${expandedItemId}`)?.classList.remove('accordion-open');
                document.getElementById(`arrow-${expandedItemId}`)?.classList.remove('rotate-90');
            }

            expandedItemId = id;
            document.getElementById(`content-${id}`)?.classList.add('accordion-open');
            document.getElementById(`arrow-${id}`)?.classList.add('rotate-90');
        }

        // Tabs
        function switchTab(tab) {
            currentTab = tab;
            expandedItemId = null; 
            
            viewTugas.classList.remove('tab-enter');
            viewLomba.classList.remove('tab-enter');
            void viewTugas.offsetWidth;
            
            if (tab === 'tugas') {
                tabTugasBtn.className = "flex-1 py-2 px-4 rounded-full font-semibold text-sm transition-colors bg-indigo-100 text-indigo-700 shadow-sm border border-indigo-200";
                tabLombaBtn.className = "flex-1 py-2 px-4 rounded-full font-semibold text-sm transition-colors text-gray-500 hover:bg-gray-100 border border-transparent";
                viewTugas.classList.remove('hidden');
                viewTugas.classList.add('tab-enter');
                viewLomba.classList.add('hidden');
            } else {
                tabLombaBtn.className = "flex-1 py-2 px-4 rounded-full font-semibold text-sm transition-colors bg-green-100 text-green-700 shadow-sm border border-green-200";
                tabTugasBtn.className = "flex-1 py-2 px-4 rounded-full font-semibold text-sm transition-colors text-gray-500 hover:bg-gray-100 border border-transparent";
                viewLomba.classList.remove('hidden');
                viewLomba.classList.add('tab-enter');
                viewTugas.classList.add('hidden');
            }
            renderData();
        }

        // Render View
        function renderData() {
            const listContainer = currentTab === 'tugas' ? viewTugas : viewLomba;
            const dataArr = currentTab === 'tugas' ? tasks : competitions;
            
            listContainer.innerHTML = '';
            
            if (dataArr.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            const sortedData = [...dataArr].sort((a, b) => currentTab === 'tugas' ? new Date(a.waktu) - new Date(b.waktu) : new Date(b.waktu) - new Date(a.waktu));

            sortedData.forEach((item, index) => {
                const isTugas = currentTab === 'tugas';
                const timeColorClass = isTugas ? 'text-red-500' : 'text-green-600';
                const timeFormatted = formatDate(item.waktu, isTugas);
                const isExpanded = expandedItemId === item.id;
                const safeHTMLDeskripsi = linkify(escapeHTML(item.deskripsi));

                const card = document.createElement('div');
                card.id = `card-${item.id}`;
                card.className = "bg-white border border-gray-100 rounded-2xl p-4 shadow-sm hover:shadow-md transition-shadow relative item-enter";
                card.style.animationDelay = `${index * 40}ms`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center gap-2 cursor-pointer flex-1" onclick="toggleDescription('${item.id}')">
                            <svg id="arrow-${item.id}" class="w-5 h-5 text-gray-400 transform transition-transform duration-300 flex-shrink-0 ${isExpanded ? 'rotate-90' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            <h3 class="font-bold text-gray-800 text-lg select-none">${item.judul}</h3>
                        </div>
                        <div class="flex space-x-1 ml-3 flex-shrink-0">
                            <button onclick="openEditModal('${item.id}')" class="text-gray-300 hover:text-indigo-500 p-1.5 transition-all rounded-full hover:bg-indigo-50 active:scale-90">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            </button>
                            <button onclick="promptDelete('${item.id}')" class="text-gray-300 hover:text-red-500 p-1.5 transition-all rounded-full hover:bg-red-50 active:scale-90">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                    
                    <div id="content-${item.id}" class="accordion-content ${isExpanded ? 'accordion-open' : ''}">
                        <div class="accordion-inner">
                            <div class="pl-7 text-sm text-gray-600 mb-4 mt-2 whitespace-pre-wrap leading-relaxed">${safeHTMLDeskripsi}</div>
                        </div>
                    </div>
                    
                    <div class="flex items-center text-xs font-semibold ${timeColorClass} bg-gray-50 inline-block px-3 py-1.5 rounded-lg border border-gray-100 mt-1">
                        <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        ${isTugas ? 'Deadline: ' : 'Dilaksanakan: '} ${timeFormatted}
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // Delete Actions
        window.promptDelete = function(id) {
            itemToDeleteId = id;
            deleteModal.classList.remove('hidden');
            setTimeout(() => {
                deleteModalContent.classList.remove('scale-95', 'opacity-0');
                deleteModalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        window.closeDeleteModal = function() {
            deleteModalContent.classList.remove('scale-100', 'opacity-100');
            deleteModalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { deleteModal.classList.add('hidden'); itemToDeleteId = null; }, 200);
        }

        window.executeDelete = function() {
            if(!itemToDeleteId) return;
            const currentId = itemToDeleteId;
            closeDeleteModal();
            
            const cardEl = document.getElementById(`card-${currentId}`);
            
            const performDelete = () => {
                if(currentTab === 'tugas') {
                    tasks = tasks.filter(t => t.id !== currentId);
                    localStorage.setItem('trackapp_tugas', JSON.stringify(tasks));
                } else {
                    competitions = competitions.filter(c => c.id !== currentId);
                    localStorage.setItem('trackapp_lomba', JSON.stringify(competitions));
                }
                renderData();
            };

            if (cardEl) {
                cardEl.classList.add('item-leave');
                setTimeout(performDelete, 300);
            } else {
                performDelete();
            }
        }

        // Modal Actions (Add/Edit)
        window.openModal = function() {
            editingItemId = null;
            document.getElementById('add-form').reset();
            modalOverlay.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);

            modalTitle.textContent = currentTab === 'tugas' ? "Tambah Tugas" : "Tambah Lomba";
            labelWaktu.textContent = currentTab === 'tugas' ? "Waktu Deadline" : "Tanggal Pelaksanaan";
            inputWaktu.type = currentTab === 'tugas' ? "datetime-local" : "date";
        }

        window.openEditModal = function(id) {
            editingItemId = id;
            const item = (currentTab === 'tugas' ? tasks : competitions).find(t => t.id === id);
            if(!item) return;

            inputJudul.value = item.judul;
            inputDeskripsi.value = item.deskripsi;
            inputWaktu.value = item.waktu;

            modalOverlay.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);

            modalTitle.textContent = currentTab === 'tugas' ? "Edit Tugas" : "Edit Lomba";
            labelWaktu.textContent = currentTab === 'tugas' ? "Waktu Deadline" : "Tanggal Pelaksanaan";
            inputWaktu.type = currentTab === 'tugas' ? "datetime-local" : "date";
        }

        window.closeModal = function() {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modalOverlay.classList.add('hidden');
                document.getElementById('add-form').reset();
                editingItemId = null;
            }, 200);
        }

        // Save Form
        window.saveData = async function(e) {
            e.preventDefault();
            
            if ("Notification" in window && Notification.permission === "default") {
                const permission = await Notification.requestPermission();
                if (permission === "granted") triggerNotification("✅ Notifikasi Aktif!", "TrackApp siap mengirim pengingat.");
            }
            
            const targetArray = currentTab === 'tugas' ? tasks : competitions;
            
            if (editingItemId) {
                const itemIndex = targetArray.findIndex(t => t.id === editingItemId);
                if (itemIndex > -1) {
                    targetArray[itemIndex] = { ...targetArray[itemIndex], judul: inputJudul.value, deskripsi: inputDeskripsi.value, waktu: inputWaktu.value, notified: false };
                }
            } else {
                targetArray.push({ id: Date.now().toString(), judul: inputJudul.value, deskripsi: inputDeskripsi.value, waktu: inputWaktu.value, notified: false });
            }

            if (currentTab === 'tugas') {
                localStorage.setItem('trackapp_tugas', JSON.stringify(tasks));
                checkDeadlines(); 
            } else {
                localStorage.setItem('trackapp_lomba', JSON.stringify(competitions));
            }

            expandedItemId = editingItemId || targetArray[targetArray.length - 1].id; // Buka accordion list yang baru disimpan/diedit
            closeModal();
            renderData();
        }

        // Notifications Check
        function triggerNotification(title, body) {
            const options = { body: body, icon: "https://placehold.co/192x192/4f46e5/ffffff?text=TA", vibrate: [200, 100, 200] };
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.ready.then(reg => reg.showNotification(title, options)).catch(() => new Notification(title, options));
            } else {
                new Notification(title, options);
            }
        }

        function checkDeadlines() {
            if (!("Notification" in window) || Notification.permission !== "granted") return;
            
            const now = new Date().getTime();
            let needsSave = false;

            tasks.forEach(task => {
                if (!task.notified) {
                    const timeDiff = new Date(task.waktu).getTime() - now;
                    if (timeDiff > 0 && timeDiff <= (24 * 60 * 60 * 1000)) {
                        triggerNotification("Pengingat Tugas! 📚", `Tugas "${task.judul}" deadline kurang dari 24 jam!`);
                        task.notified = true;
                        needsSave = true;
                    }
                }
            });

            if (needsSave) localStorage.setItem('trackapp_tugas', JSON.stringify(tasks));
        }

        // Init
        renderData();
        checkDeadlines();
        setInterval(checkDeadlines, 60000);

        // PWA Setup
        const appManifest = {
            "name": "TrackApp",
            "short_name": "TrackApp",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#4f46e5",
            "icons": [{ "src": "https://placehold.co/512x512/4f46e5/ffffff?text=TA", "sizes": "512x512", "type": "image/png" }]
        };
        document.getElementById('dynamic-manifest').setAttribute('href', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(appManifest)));

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-banner').classList.remove('hidden');
        });

        document.getElementById('install-btn').addEventListener('click', async () => {
            document.getElementById('install-banner').classList.add('hidden');
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
            }
        });

        window.closeInstallBanner = function() {
            document.getElementById('install-banner').classList.add('hidden');
        };

        // PWA Service Worker (Aman dari error Blob)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {
                    console.log('Catatan: Untuk mengaktifkan mode offline sepenuhnya di GitHub Pages, buatlah file kosong bernama sw.js di samping file index.html ini.');
                });
            });
        }
    </script>
</body>
</html>
