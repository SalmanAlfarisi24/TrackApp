<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrackApp</title>
    
    <!-- Meta tags for PWA / App-like experience -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4f46e5">
    
    <!-- Ikon Web & Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text x='50' y='65' font-family='sans-serif' font-size='50' font-weight='bold' fill='white' text-anchor='middle'>TA</text></svg>" type="image/svg+xml">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/4f46e5/ffffff?text=TA">

    <!-- Dynamic Manifest Link (will be injected by JS) -->
    <link rel="manifest" id="dynamic-manifest">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Smooth scrolling and hide scrollbar for modern app look */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Modal animation */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 200ms ease-out, transform 200ms ease-out; }
        .modal-exit { opacity: 1; transform: scale(1); }
        .modal-exit-active { opacity: 0; transform: scale(0.95); transition: opacity 200ms ease-in, transform 200ms ease-in; }
    </style>
</head>
<body class="text-gray-800 antialiased overflow-hidden">

    <!-- Mobile App Container (Centered on desktop) -->
    <div class="max-w-md mx-auto bg-white h-screen flex flex-col relative shadow-2xl overflow-hidden">
        
        <!-- PWA Install Banner (Hidden by default) -->
        <div id="install-banner" class="hidden bg-indigo-600 text-white px-4 py-3 flex justify-between items-center z-50">
            <div class="flex flex-col">
                <span class="font-bold text-sm">Install App</span>
                <span class="text-xs text-indigo-200">Tambahkan ke layar utama</span>
            </div>
            <button id="install-btn" class="bg-white text-indigo-600 px-3 py-1 rounded-full text-sm font-semibold shadow active:scale-95 transition-transform">Install</button>
        </div>

        <!-- Header -->
        <header class="bg-indigo-600 text-white pt-6 pb-4 px-6 rounded-b-2xl shadow-md z-10 flex-shrink-0">
            <h1 class="text-2xl font-bold tracking-tight">TrackApp</h1>
            <p class="text-indigo-200 text-sm mt-1">Kelola Tugas & Lomba Anda</p>
        </header>

        <!-- Tabs Navigation -->
        <div class="flex px-4 pt-4 pb-2 space-x-2 flex-shrink-0">
            <button id="tab-tugas" onclick="switchTab('tugas')" class="flex-1 py-2 px-4 rounded-full font-semibold text-sm transition-colors bg-indigo-100 text-indigo-700 shadow-sm border border-indigo-200">
                Tugas Kuliah
            </button>
            <button id="tab-lomba" onclick="switchTab('lomba')" class="flex-1 py-2 px-4 rounded-full font-semibold text-sm transition-colors text-gray-500 hover:bg-gray-100 border border-transparent">
                Lomba
            </button>
        </div>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto no-scrollbar p-4 relative pb-24">
            
            <!-- List Tugas -->
            <div id="view-tugas" class="space-y-4">
                <!-- Items will be generated by JS -->
            </div>

            <!-- List Lomba -->
            <div id="view-lomba" class="hidden space-y-4">
                <!-- Items will be generated by JS -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden flex flex-col items-center justify-center h-full text-gray-400 mt-20">
                <svg class="w-16 h-16 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                <p class="text-center font-medium">Belum ada data.<br>Tekan tombol + untuk menambah.</p>
            </div>
        </main>

        <!-- Floating Action Button (FAB) -->
        <button onclick="openModal()" class="absolute bottom-6 right-6 w-14 h-14 bg-indigo-600 rounded-full shadow-lg hover:shadow-xl text-white flex items-center justify-center hover:bg-indigo-700 active:bg-indigo-800 active:scale-90 transition-all z-20">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </button>

        <!-- Modal Overlay -->
        <div id="modal-overlay" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center px-4">
            <!-- Modal Content -->
            <div id="modal-content" class="bg-white rounded-2xl w-full max-w-sm shadow-2xl p-6 transition-all transform scale-95 opacity-0">
                <div class="flex justify-between items-center mb-5">
                    <h2 id="modal-title" class="text-xl font-bold text-gray-800">Tambah Data</h2>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 p-1">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                
                <form id="add-form" onsubmit="saveData(event)">
                    <div class="space-y-4">
                        <!-- Judul -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Judul</label>
                            <input type="text" id="input-judul" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="Masukkan judul...">
                        </div>
                        <!-- Deskripsi -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi</label>
                            <textarea id="input-deskripsi" rows="3" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all resize-none" placeholder="Tulis keterangan detail..."></textarea>
                        </div>
                        <!-- Waktu (Dynamic) -->
                        <div>
                            <label id="label-waktu" class="block text-sm font-medium text-gray-700 mb-1">Waktu</label>
                            <input type="datetime-local" id="input-waktu" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-gray-700 bg-white">
                        </div>
                    </div>
                    
                    <div class="mt-8 flex space-x-3">
                        <button type="button" onclick="closeModal()" class="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-medium hover:bg-gray-200 active:scale-95 transition-all">Batal</button>
                        <button type="submit" class="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl font-medium hover:bg-indigo-700 active:scale-95 transition-all shadow-md shadow-indigo-200">Simpan</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Custom Delete Confirmation Modal -->
        <div id="delete-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center px-4">
            <div id="delete-modal-content" class="bg-white rounded-2xl w-full max-w-sm shadow-2xl p-6 transition-all transform scale-95 opacity-0 text-center">
                <div class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                </div>
                <h2 class="text-xl font-bold text-gray-800 mb-2">Hapus Data?</h2>
                <p class="text-gray-500 text-sm mb-6">Apakah Anda yakin ingin menghapus data ini? Tindakan ini tidak dapat dibatalkan.</p>
                <div class="flex space-x-3">
                    <button onclick="closeDeleteModal()" class="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-medium hover:bg-gray-200 active:scale-95 transition-all">Batal</button>
                    <button onclick="executeDelete()" class="flex-1 py-2.5 bg-red-600 text-white rounded-xl font-medium hover:bg-red-700 active:scale-95 transition-all shadow-md shadow-red-200">Ya, Hapus</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // State Management
        let currentTab = 'tugas'; // 'tugas' or 'lomba'
        let tasks = JSON.parse(localStorage.getItem('trackapp_tugas')) || [];
        let competitions = JSON.parse(localStorage.getItem('trackapp_lomba')) || [];

        // DOM Elements
        const tabTugasBtn = document.getElementById('tab-tugas');
        const tabLombaBtn = document.getElementById('tab-lomba');
        const viewTugas = document.getElementById('view-tugas');
        const viewLomba = document.getElementById('view-lomba');
        const emptyState = document.getElementById('empty-state');
        
        const modalOverlay = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const labelWaktu = document.getElementById('label-waktu');
        const inputWaktu = document.getElementById('input-waktu');
        const inputJudul = document.getElementById('input-judul');
        const inputDeskripsi = document.getElementById('input-deskripsi');

        const deleteModal = document.getElementById('delete-modal');
        const deleteModalContent = document.getElementById('delete-modal-content');
        let itemToDeleteId = null;

        // Format Date utility
        function formatDate(dateString, isDatetime) {
            const options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
            if (isDatetime) {
                options.hour = '2-digit';
                options.minute = '2-digit';
            }
            return new Date(dateString).toLocaleDateString('id-ID', options);
        }

        // Switch Tabs
        function switchTab(tab) {
            currentTab = tab;
            
            if (tab === 'tugas') {
                tabTugasBtn.className = "flex-1 py-2 px-4 rounded-full font-semibold text-sm transition-colors bg-indigo-100 text-indigo-700 shadow-sm border border-indigo-200";
                tabLombaBtn.className = "flex-1 py-2 px-4 rounded-full font-semibold text-sm transition-colors text-gray-500 hover:bg-gray-100 border border-transparent";
                
                viewTugas.classList.remove('hidden');
                viewLomba.classList.add('hidden');
            } else {
                tabLombaBtn.className = "flex-1 py-2 px-4 rounded-full font-semibold text-sm transition-colors bg-green-100 text-green-700 shadow-sm border border-green-200";
                tabTugasBtn.className = "flex-1 py-2 px-4 rounded-full font-semibold text-sm transition-colors text-gray-500 hover:bg-gray-100 border border-transparent";
                
                viewLomba.classList.remove('hidden');
                viewTugas.classList.add('hidden');
            }
            renderData();
        }

        // Render Data to List
        function renderData() {
            const listContainer = currentTab === 'tugas' ? viewTugas : viewLomba;
            const dataArr = currentTab === 'tugas' ? tasks : competitions;
            
            listContainer.innerHTML = ''; // Clear current
            
            if (dataArr.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                const sortedData = [...dataArr].sort((a, b) => {
                    return currentTab === 'tugas' 
                        ? new Date(a.waktu) - new Date(b.waktu) 
                        : new Date(b.waktu) - new Date(a.waktu);
                });

                sortedData.forEach(item => {
                    const isTugas = currentTab === 'tugas';
                    const timeColorClass = isTugas ? 'text-red-500' : 'text-green-600';
                    const timeFormatted = formatDate(item.waktu, isTugas);

                    const card = document.createElement('div');
                    card.className = "bg-white border border-gray-100 rounded-2xl p-4 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group";
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-gray-800 text-lg flex items-center gap-2">
                                ${item.judul}
                            </h3>
                            <button onclick="promptDelete('${item.id}')" class="text-gray-300 hover:text-red-500 p-1 transition-colors rounded-full hover:bg-red-50">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                        <p class="text-sm text-gray-600 mb-3 leading-relaxed">${item.deskripsi}</p>
                        <div class="flex items-center text-xs font-semibold ${timeColorClass} bg-gray-50 inline-block px-3 py-1.5 rounded-lg border border-gray-100">
                            <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            ${isTugas ? 'Deadline: ' : 'Dilaksanakan: '} ${timeFormatted}
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            }
        }

        // Delete Item
        window.promptDelete = function(id) {
            itemToDeleteId = id;
            deleteModal.classList.remove('hidden');
            setTimeout(() => {
                deleteModalContent.classList.remove('scale-95', 'opacity-0');
                deleteModalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        window.closeDeleteModal = function() {
            deleteModalContent.classList.remove('scale-100', 'opacity-100');
            deleteModalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                deleteModal.classList.add('hidden');
                itemToDeleteId = null;
            }, 200);
        }

        window.executeDelete = function() {
            if(itemToDeleteId) {
                if(currentTab === 'tugas') {
                    tasks = tasks.filter(t => t.id !== itemToDeleteId);
                    localStorage.setItem('trackapp_tugas', JSON.stringify(tasks));
                } else {
                    competitions = competitions.filter(c => c.id !== itemToDeleteId);
                    localStorage.setItem('trackapp_lomba', JSON.stringify(competitions));
                }
                renderData();
                closeDeleteModal();
            }
        }

        // Open Modal
        window.openModal = function() {
            modalOverlay.classList.remove('hidden');
            
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);

            if (currentTab === 'tugas') {
                modalTitle.textContent = "Tambah Tugas Kuliah";
                labelWaktu.textContent = "Waktu Deadline";
                inputWaktu.type = "datetime-local"; 
            } else {
                modalTitle.textContent = "Tambah Riwayat Lomba";
                labelWaktu.textContent = "Tanggal Pelaksanaan";
                inputWaktu.type = "date"; 
            }
        }

        // Close Modal
        window.closeModal = function() {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modalOverlay.classList.add('hidden');
                document.getElementById('add-form').reset();
            }, 200);
        }

        // Trigger request permission and save
        window.saveData = function(e) {
            e.preventDefault();
            
            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission();
            }
            
            const newItem = {
                id: Date.now().toString(),
                judul: inputJudul.value,
                deskripsi: inputDeskripsi.value,
                waktu: inputWaktu.value,
                notified: false
            };

            if (currentTab === 'tugas') {
                tasks.push(newItem);
                localStorage.setItem('trackapp_tugas', JSON.stringify(tasks));
                checkDeadlines(); // Langsung cek notifikasi sesudah simpan
            } else {
                competitions.push(newItem);
                localStorage.setItem('trackapp_lomba', JSON.stringify(competitions));
            }

            closeModal();
            renderData();
        }

        renderData();

        // Fungsi khusus pengiriman notifikasi yang lebih kuat (lewat Service Worker)
        function triggerNotification(title, body) {
            const options = {
                body: body,
                icon: "https://placehold.co/192x192/4f46e5/ffffff?text=TA",
                vibrate: [200, 100, 200]
            };

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.ready.then(function(registration) {
                    registration.showNotification(title, options);
                }).catch(function() {
                    // Fallback jika SW gagal
                    new Notification(title, options);
                });
            } else {
                new Notification(title, options);
            }
        }

        function checkDeadlines() {
            if (!("Notification" in window) || Notification.permission !== "granted") return;
            
            const now = new Date().getTime();
            const oneDay = 24 * 60 * 60 * 1000;
            let needsSave = false;

            tasks.forEach(task => {
                if (!task.notified) {
                    const taskTime = new Date(task.waktu).getTime();
                    const timeDiff = taskTime - now;
                    
                    // Cek jika waktu deadline berada di antara sekarang (0) sampai 24 jam ke depan
                    if (timeDiff > 0 && timeDiff <= oneDay) {
                        triggerNotification("Pengingat Tugas! 📚", `Tugas "${task.judul}" memiliki deadline dalam waktu kurang dari 24 jam!`);
                        task.notified = true;
                        needsSave = true;
                    }
                }
            });

            if (needsSave) {
                localStorage.setItem('trackapp_tugas', JSON.stringify(tasks));
            }
        }

        checkDeadlines();
        setInterval(checkDeadlines, 60000);

        // --- PWA CAPABILITIES ---
        const appManifest = {
            "name": "TrackApp Tugas & Lomba",
            "short_name": "TrackApp",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#4f46e5",
            "icons": [
                {
                    "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text x='50' y='65' font-family='sans-serif' font-size='50' font-weight='bold' fill='white' text-anchor='middle'>TA</text></svg>",
                    "sizes": "512x512",
                    "type": "image/svg+xml"
                },
                {
                    "src": "https://placehold.co/192x192/4f46e5/ffffff?text=TA",
                    "sizes": "192x192",
                    "type": "image/png"
                },
                {
                    "src": "https://placehold.co/512x512/4f46e5/ffffff?text=TA",
                    "sizes": "512x512",
                    "type": "image/png"
                }
            ]
        };
        const manifestString = JSON.stringify(appManifest);
        document.getElementById('dynamic-manifest').setAttribute('href', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(manifestString));

        let deferredPrompt;
        const installBanner = document.getElementById('install-banner');
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            installBanner.classList.add('hidden');
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
            }
        });

        // Register Service Worker
        const swCode = `
            self.addEventListener('install', (e) => { self.skipWaiting(); });
            self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
            self.addEventListener('fetch', (e) => { 
                e.respondWith(fetch(e.request).catch(() => new Response('App is offline'))); 
            });
        `;
        const swBlob = new Blob([swCode], {type: 'application/javascript'});
        const swUrl = URL.createObjectURL(swBlob);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register(swUrl).then(registration => {
                    console.log('ServiceWorker registration successful');
                }).catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
